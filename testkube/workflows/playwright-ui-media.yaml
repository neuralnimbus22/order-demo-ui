apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: playwright-ui-media
  labels:
    app: order-demo
    tool: playwright
    suite: e2e
  annotations:
    description: >-
      Runs the Playwright functional suite with a screenshot and a video of
      every test. The HTML report, the per-test screenshots and videos, and the
      JUnit report are saved with the run.
spec:
  content:
    git:
      uri: https://github.com/neuralnimbus22/order-demo-ui
      revision: main
  container:
    workingDir: /data/repo
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    env:
      - name: E2E_BASE_URL
        value: http://order-demo-ui.order-demo.svc.cluster.local:3000
      - name: CI
        value: "true"
      - name: PW_SCREENSHOT
        value: "on"
      - name: PW_VIDEO
        value: "on"
      - name: PLAYWRIGHT_JUNIT_OUTPUT_NAME
        value: /data/repo/junit.xml
  execution:
    target:
      match:
        name:
          - testkube-se-runner-testkube-runner
  steps:
    - name: Install dependencies
      shell: npm ci
    - name: Run Playwright tests
      shell: npx playwright test --project=chromium --reporter=line,html,junit
      artifacts:
        paths:
          - playwright-report/**
          - test-results/**
          - junit.xml
