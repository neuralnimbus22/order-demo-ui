# Resolves the pending commit status to "failure" when a release-gate
# execution ends in any non-passing state.
#
# Apply with: kubectl apply -f testkube/webhooks/ -n <agent-namespace>
# (agent namespace for this environment is lakshmi-testkube)
#
# Requires a Testkube credential named "github-status-token" holding a GitHub
# token with repo:status scope. This file deliberately contains no token --
# only a reference to one. See testkube/webhooks/README.md.
apiVersion: executor.testkube.io/v1
kind: Webhook
metadata:
  name: github-commit-status-failure
  namespace: lakshmi-testkube
spec:
  events:
    - end-testworkflow-failed
    - end-testworkflow-aborted
    - end-testworkflow-canceled
  # Matches only the five CI-only gate workflows (testkube/workflows/).
  # NOT purpose=release-decision-demo: that label also covers the hourly
  # cron workflows and four unrelated service checks, none of which carry
  # a sha tag. See testkube/webhooks/README.md.
  selector: gate=release
  # The full 40-char SHA travels on the execution as the "sha" tag, set by
  # .github/workflows/testkube-release-gate.yml.
  uri: https://api.github.com/repos/neuralnimbus22/order-demo-ui/statuses/{{ index .TestWorkflowExecution.Tags "sha" }}
  headers:
    Authorization: 'Bearer {{credential("github-status-token")}}'
    Accept: application/vnd.github+json
    Content-Type: application/json
    X-GitHub-Api-Version: "2022-11-28"
  payloadTemplate: |
    {
      "state": "failure",
      "context": "testkube/{{ .TestWorkflowExecution.Workflow.Name }}",
      "description": "{{ .TestWorkflowExecution.Result.Status }} (release {{ index .TestWorkflowExecution.Tags "release" }})",
      "target_url": "{{ .ExecutionURL }}"
    }
