name: Testkube Release Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Testkube CLI
        uses: kubeshop/setup-testkube@v1
        with:
          organization: tkcorg_b5ace2135f138dc8
          environment: tkcenv_362177294460621a
          token: ${{ secrets.TESTKUBE_API_TOKEN }}

      - name: Derive execution metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            trigger="pr-${{ github.event.pull_request.number }}"
          else
            sha="${{ github.sha }}"
            trigger="main"
          fi
          {
            echo "sha=$sha"
            echo "commit=$(echo "$sha" | cut -c1-7)"
            echo "release=$(date -u +%Y.%m.%d)-${{ github.run_number }}"
            echo "trigger=$trigger"
          } >> "$GITHUB_OUTPUT"

      - name: Fire Testkube workflows and set pending statuses
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          RELEASE: ${{ steps.meta.outputs.release }}
          TRIGGER: ${{ steps.meta.outputs.trigger }}
        run: |
          set -euo pipefail
          # The *-gate workflows are CI-only (testkube/workflows/). The *-check
          # workflows they were copied from still run hourly on cron and are
          # deliberately not touched here -- see testkube/webhooks/README.md.
          workflows="coordinator-gate attack-agents-gate validators-gate surface-mapper-gate findings-pipeline-gate"

          for wf in $workflows; do
            # Fire and do not watch. Without -f the CLI returns as soon as the
            # execution is queued, so the runner is not billed for the suite.
            testkube run testworkflow "$wf" \
              --target name=testkube-se-runner-testkube-runner \
              --tag "sha=$SHA" \
              --tag "commit=$COMMIT" \
              --tag "release=$RELEASE" \
              --tag "trigger=$TRIGGER" \
              --tag "env=staging"

            # The Testkube webhook resolves this to success/failure when the
            # execution ends. See testkube/webhooks/ in this repo.
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state=pending \
              -f context="testkube/$wf" \
              -f description="Queued on the cluster (release $RELEASE)" \
              --silent
          done

          echo "All five queued. Runner exiting; results arrive by webhook."
