# Grafana for the lab: two data sources (Loki, Prometheus) and three dashboards.
# Chart: grafana-community/grafana 13.3.0 (Grafana 13.2). The Grafana chart
# moved from grafana/helm-charts to grafana-community/helm-charts.
# Install: see observability/README.md, step 5.

# No admin password here on purpose. The chart generates one and stores it in
# the Secret "grafana", key admin-password (README step 6 shows how to read it).
# The admin login is only needed to change things; viewing needs no login
# (see auth.anonymous below).
adminUser: admin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Open Grafana straight from the browser at http://192.168.2.15:30300, with no
# port-forward. 192.168.2.15 is the Dell's address on the home network.
# 30300 is free: the NodePorts already in use are 31580 (nginx-service),
# 30141 and 30897 (Traefik). Check: kubectl --context default get svc -A | grep NodePort
service:
  type: NodePort
  nodePort: 30300

# The helm test pod is not needed in the lab.
testFramework:
  enabled: false

grafana.ini:
  analytics:
    # Do not send usage statistics from the lab.
    reporting_enabled: false
  auth.anonymous:
    # Anyone who opens the address sees the dashboards without logging in,
    # read-only. The lab is only reachable on the home network.
    enabled: true
    org_role: Viewer

# Loki, at the service name and port that loki-values.yaml creates
# (release "loki", gateway off, HTTP port 3100).
# Prometheus, at the service name and port that prometheus-values.yaml creates
# (release "prometheus" -> service "prometheus-server", port 80).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
        isDefault: true
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.observability.svc.cluster.local
        access: proxy

# Load dashboards from files the chart mounts under
# /var/lib/grafana/dashboards/<provider>. The provider name "testkube" must
# match the key under "dashboards" below.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: testkube
        orgId: 1
        folder: Testkube
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/testkube

dashboards:
  testkube:
    # One dashboard: how much each workflow logged, the step output itself,
    # and the order-demo services' own logs underneath for comparison.
    testkube-workflow-logs:
      json: |
        {
          "title": "Testkube workflow logs",
          "uid": "testkube-workflow-logs",
          "schemaVersion": 39,
          "editable": true,
          "time": { "from": "now-1h", "to": "now" },
          "refresh": "30s",
          "templating": {
            "list": [
              {
                "name": "workflow",
                "label": "Workflow",
                "type": "query",
                "datasource": { "type": "loki", "uid": "loki" },
                "query": "label_values({namespace=\"testkube\"}, workflow)",
                "refresh": 2,
                "includeAll": true,
                "allValue": ".+",
                "multi": true,
                "sort": 1,
                "current": { "selected": true, "text": ["All"], "value": ["$__all"] }
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Log lines per workflow",
              "gridPos": { "x": 0, "y": 0, "w": 24, "h": 7 },
              "datasource": { "type": "loki", "uid": "loki" },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (workflow) (count_over_time({namespace=\"testkube\", workflow=~\"$workflow\"} [1m]))",
                  "legendFormat": "{{workflow}}"
                }
              ],
              "fieldConfig": {
                "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60 } },
                "overrides": []
              },
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
            },
            {
              "id": 2,
              "type": "logs",
              "title": "Workflow step output",
              "gridPos": { "x": 0, "y": 7, "w": 24, "h": 12 },
              "datasource": { "type": "loki", "uid": "loki" },
              "targets": [
                { "refId": "A", "expr": "{namespace=\"testkube\", workflow=~\"$workflow\"}" }
              ],
              "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true }
            },
            {
              "id": 3,
              "type": "logs",
              "title": "order-demo service logs",
              "gridPos": { "x": 0, "y": 19, "w": 24, "h": 10 },
              "datasource": { "type": "loki", "uid": "loki" },
              "targets": [
                { "refId": "A", "expr": "{namespace=\"order-demo\"}" }
              ],
              "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true }
            }
          ]
        }

    # Runner metrics from Prometheus: is the runner up, how many runs passed
    # and failed, how long runs and their steps took. Metric names from the
    # runner's source (internal/app/api/metrics/metrics.go in the Testkube
    # repo, tag v2.12.0, the version the lab runs):
    #   testkube_testworkflow_executions_count         counter, labels name, result
    #   testkube_testworkflow_executions_duration_ms   summary, same labels
    #   testkube_testworkflow_execution_steps_duration_ms  gauge, per step
    # The runner keeps a duration series for every workflow it has ever run.
    # The per-workflow duration panel ends in "> 0" so workflows with no run
    # in the last 24 hours drop out instead of showing as NaN.
    testkube-runs:
      json: |
        {
          "title": "Testkube runs",
          "uid": "testkube-runs",
          "schemaVersion": 39,
          "editable": true,
          "time": {
            "from": "now-24h",
            "to": "now"
          },
          "refresh": "30s",
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Runner",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 6,
                "h": 5
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "up{job=\"testkube-runner\"}",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  },
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "0": {
                          "text": "Down",
                          "index": 0
                        },
                        "1": {
                          "text": "Up",
                          "index": 1
                        }
                      }
                    }
                  ]
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "value",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Passed runs, last 24 hours",
              "gridPos": {
                "x": 6,
                "y": 0,
                "w": 6,
                "h": 5
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(increase(testkube_testworkflow_executions_count{result=\"passed\"}[24h])) or vector(0)",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  },
                  "decimals": 0
                },
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "textMode": "value",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Failed runs, last 24 hours",
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 6,
                "h": 5
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(increase(testkube_testworkflow_executions_count{result=\"failed\"}[24h])) or vector(0)",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  },
                  "decimals": 0
                },
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "textMode": "value",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Average run, last 24 hours",
              "gridPos": {
                "x": 18,
                "y": 0,
                "w": 6,
                "h": 5
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(increase(testkube_testworkflow_executions_duration_ms_sum[24h])) / sum(increase(testkube_testworkflow_executions_duration_ms_count[24h]))",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "text",
                        "value": null
                      }
                    ]
                  },
                  "unit": "ms",
                  "decimals": 1
                },
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "textMode": "value",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Runs per workflow",
              "gridPos": {
                "x": 0,
                "y": 5,
                "w": 24,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (name, result) (increase(testkube_testworkflow_executions_count[$__rate_interval]))",
                  "legendFormat": "{{name}} ({{result}})"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "decimals": 0,
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 60,
                    "lineWidth": 1
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi"
                }
              }
            },
            {
              "id": 6,
              "type": "bargauge",
              "title": "Average run duration per workflow, last 24 hours",
              "gridPos": {
                "x": 0,
                "y": 13,
                "w": 12,
                "h": 9
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum by (name) (increase(testkube_testworkflow_executions_duration_ms_sum[24h])) / sum by (name) (increase(testkube_testworkflow_executions_duration_ms_count[24h]))) > 0",
                  "legendFormat": "{{name}}",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ms",
                  "decimals": 1,
                  "min": 0,
                  "color": {
                    "mode": "fixed",
                    "fixedColor": "blue"
                  }
                },
                "overrides": []
              },
              "options": {
                "orientation": "horizontal",
                "displayMode": "basic",
                "showUnfilled": true,
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                }
              }
            },
            {
              "id": 7,
              "type": "table",
              "title": "Step durations, latest run of each workflow",
              "gridPos": {
                "x": 12,
                "y": 13,
                "w": 12,
                "h": 9
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max by (workflow_name, step_name, status) (testkube_testworkflow_execution_steps_duration_ms)",
                  "format": "table",
                  "instant": true
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ms"
                },
                "overrides": []
              },
              "transformations": [
                {
                  "id": "organize",
                  "options": {
                    "excludeByName": {
                      "Time": true
                    },
                    "renameByName": {
                      "workflow_name": "Workflow",
                      "step_name": "Step",
                      "status": "Status",
                      "Value": "Duration"
                    }
                  }
                }
              ],
              "options": {
                "showHeader": true
              }
            }
          ]
        }
    # The starter dashboard Testkube publishes (assets/grafana-dasboard.json in
    # the Testkube repo), unchanged except: its data source now points at the
